<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <title>Brenda Okafor, HR Business Partner</title>
  <defs>
    <path id="hr-face" d="M48 23.5 C55.8 23.5 61.2 28 61.6 35.6 L61.2 43.4 C60.8 47.6 59.4 51 57.4 53.8 L53.8 58.4 Q48 62.6 42.2 58.4 L38.6 53.8 C36.6 51 35.2 47.6 34.8 43.4 L34.4 35.6 C34.8 28 40.2 23.5 48 23.5 Z"/>
    <path id="hr-hair" d="M33.6 45 C28.6 37 28.4 25 34.6 18.4 C40.4 12.2 55.6 12.2 61.4 18.4 C67.6 25 67.4 37 62.4 45 L61.2 45 C61.6 37.6 59.8 32.4 55.6 30 C51.6 28 44.4 28 40.4 30 C36.2 32.4 34.4 37.6 34.8 45 Z"/>
    <path id="hr-suit" d="M2 96 L3.6 85 C5 77.4 14.6 73.4 27.6 71.2 L40 68 L56 68 L68.4 71.2 C81.4 73.4 91 77.4 92.4 85 L94 96 Z"/>
    <clipPath id="hr-cFace"><use href="#hr-face"/></clipPath>
    <clipPath id="hr-cHair"><use href="#hr-hair"/></clipPath>
    <clipPath id="hr-cSuit"><use href="#hr-suit"/></clipPath>
  </defs>
  <rect width="96" height="96" fill="#f1f3f5"/>
  <path d="M8 13 H76 L86 23 V96 H8 Z" fill="#e2e6ea"/>
  <path d="M8 9.5 H30 L27.4 13 H8 Z" fill="#d63f28"/>
  <g transform="translate(-9.6 -6.4) scale(1.2)">

  <!-- neck -->
  <path d="M43.4 55 C44 61 43.8 65 43 69.5 L53 69.5 C52.2 65 52 61 52.6 55 Z" fill="#6c4636"/>
  <path d="M43.6 58 L52.4 58 L52.6 62 Q48 65.4 43.4 62 Z" fill="#5c3b2d"/>
  <!-- blouse -->
  <path d="M38 68 L58 68 L54 96 L42 96 Z" fill="#dfe3e7"/>
  <path d="M42.6 67.6 Q48 72.4 53.4 67.6 L54.4 69 Q48 75 41.6 69 Z" fill="#c9ced4"/>
  <!-- blazer -->
  <use href="#hr-suit" fill="#262a30"/>
  <g clip-path="url(#hr-cSuit)">
    <path d="M3.6 85 C5 77.4 14.6 73.4 27.6 71.2 L31 70.4 C22 74 16.4 79 15 85 L13.4 96 L2 96 Z" fill="#2f343b"/>
    <path d="M68.4 71.2 C81.4 73.4 91 77.4 92.4 85 L94 96 L76 96 C78 88 78 80 72 72 Z" fill="#1d2025"/>
    <!-- open front showing the blouse -->
    <path d="M40.6 68 L55.4 68 L51 96 L45 96 Z" fill="#dfe3e7"/>
    <path d="M51.4 74 L55.4 68 L51 96 L48.6 96 Z" fill="#cdd2d7"/>
  </g>
  <!-- lapels, piped in vermilion -->
  <path d="M40.6 68 L45.6 90 L41 96 L36 96 L34.4 83 L37.4 79 L34 73.4 Z" fill="#363c44"/>
  <path d="M55.4 68 L50.4 90 L55 96 L60 96 L61.6 83 L58.6 79 L62 73.4 Z" fill="#2b3037"/>
  <path d="M40.6 68 L45.6 90 L44.8 91 L39.8 69.2 Z" fill="#d63f28"/>
  <path d="M55.4 68 L50.4 90 L51.2 91 L56.2 69.2 Z" fill="#d63f28"/>
  <!-- HR lanyard and badge -->
  <path d="M43.2 69 L47.2 76.4 M52.8 69 L48.8 76.4" stroke="#d63f28" stroke-width="1.7" fill="none"/>
  <rect x="47" y="75.6" width="2" height="2.4" fill="#8c939c"/>
  <rect x="43.4" y="77.6" width="9.2" height="10" rx=".6" fill="#ffffff"/>
  <rect x="43.4" y="77.6" width="9.2" height="2.6" fill="#d63f28"/>
  <rect x="45" y="81.4" width="3.4" height="3.8" fill="#8c939c"/>
  <rect x="49.4" y="81.8" width="2" height=".9" fill="#23272d"/>
  <rect x="49.4" y="83.8" width="2" height=".9" fill="#23272d"/>
  <!-- S pin on the shoulder side -->
  <path d="M66 81 H70.2 L71.4 82.2 V86.4 H66 Z" fill="#d63f28"/>

  <!-- hair: rounded natural crop, back mass -->
  <use href="#hr-hair" fill="#2c2522"/>
  <!-- ears -->
  <path d="M35 38.6 C32 37.8 31.4 42 32 45.2 C32.6 48 34 49.4 35.6 49 Z" fill="#74503f"/>
  <path d="M61 38.6 C64 37.8 64.6 42 64 45.2 C63.4 48 62 49.4 60.4 49 Z" fill="#62402f"/>
  <circle cx="33.2" cy="49.2" r="1" fill="#e9e2cf"/>
  <!-- face: one light plane, one shadow plane -->
  <use href="#hr-face" fill="#80563f"/>
  <g clip-path="url(#hr-cFace)">
    <path d="M55.4 20 L66 20 L66 64 L49 64 L57.6 45 Z" fill="#6f4a37"/>
    <!-- nose: a shadow plane and a tip -->
    <path d="M48.2 40 L50.6 47.6 L47.2 48.2 Z" fill="#6f4a37"/>
    <path d="M45 47.6 Q48 49.6 51.4 47.6 Q48 50.2 45 47.6 Z" fill="#5a3a2c"/>
    <!-- gentle smile -->
    <path d="M44 52.2 Q48 55.4 52 52.2 Q48 53.6 44 52.2 Z" fill="#4a2a22"/>
    <path d="M45.2 53.8 Q48 55.4 50.8 53.8 Q48 56.2 45.2 53.8 Z" fill="#6a3c31"/>
  </g>
  <!-- tired, kind eyes: soft lids, brows lifted at the centre -->
  <path d="M39.6 41.2 Q42.2 39.4 44.8 41.2 Q42.2 42.8 39.6 41.2 Z" fill="#1d1513"/>
  <path d="M51.2 41.2 Q53.8 39.4 56.4 41.2 Q53.8 42.8 51.2 41.2 Z" fill="#1d1513"/>
  <path d="M39.4 40.6 Q42.2 38.4 45 40.4" stroke="#5c3b2d" stroke-width=".8" fill="none"/>
  <path d="M51 40.4 Q53.8 38.4 56.6 40.6" stroke="#4e3226" stroke-width=".8" fill="none"/>
  <path d="M38.6 36 Q41.4 34.4 45 35.2" stroke="#221a17" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <path d="M51 35.2 Q54.6 34.4 57.4 36" stroke="#221a17" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- hair front: flat dark with a lit sweep, a grey streak and a darker far side -->
  <g clip-path="url(#hr-cHair)">
    <use href="#hr-hair" fill="#2c2522"/>
    <path d="M30 34 C30 22 38 14 50 13 L56 13 C44 16 37 22 35 32 Z" fill="#3e3531"/>
    <path d="M35.4 36 C36.4 30 40 26.4 45 25.6 L44 28.4 C40.4 29.4 37.6 32.4 36.6 38 Z" fill="#7d7672"/>
    <path d="M58 14 L70 14 L70 48 L62 48 C65 36 64 22 58 14 Z" fill="#221c1a"/>
  </g>
  <!-- reading glasses, low on the nose, on a chain -->
  <path d="M35.4 42.6 C36 51 38.6 59 43.4 66" stroke="#c6a76a" stroke-width=".7" fill="none" stroke-dasharray="1 .6"/>
  <path d="M60.6 42.6 C60 51 57.4 59 52.6 66" stroke="#a88d58" stroke-width=".7" fill="none" stroke-dasharray="1 .6"/>
  <g fill="#ffffff" fill-opacity=".16" stroke="#c6a76a" stroke-width="1">
    <path d="M38.4 42.8 H46 V44.2 Q46 47.4 42.2 47.4 Q38.4 47.4 38.4 44.2 Z"/>
    <path d="M50 42.8 H57.6 V44.2 Q57.6 47.4 53.8 47.4 Q50 47.4 50 44.2 Z"/>
  </g>
  <path d="M46 43.4 Q48 42.2 50 43.4" stroke="#c6a76a" stroke-width=".9" fill="none"/>
  <path d="M38.4 43.2 L35.4 42.4 M57.6 43.2 L60.6 42.4" stroke="#c6a76a" stroke-width=".9"/>
  </g>
</svg>
