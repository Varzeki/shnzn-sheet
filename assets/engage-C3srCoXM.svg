    <path d="M34.6 38.4 C31.4 37.6 30.8 42 31.4 45.2 C32 48 33.4 49.4 35.2 49 Z" fill="#9c6b4f"/>
    <path d="M61.4 38.4 C64.6 37.6 65.2 42 64.6 45.2 C64 48 62.6 49.4 60.8 49 Z" fill="#87593f"/>
