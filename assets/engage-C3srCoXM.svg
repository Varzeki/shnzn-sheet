      <path d="M67.6 70.6 C81 72.8 91 76.8 92.4 84.6 L94 96 L76.4 96 C78.4 88 78.4 80 72.4 71.6 Z" fill="#1d2025"/>
      <path d="M41.4 67.4 L54.6 67.4 L50.6 96 L45.4 96 Z" fill="#eef1f3"/>
      <path d="M50.4 75 L54.6 67.4 L50.6 96 L48.4 96 Z" fill="#dce1e5"/>
    </g>
    <!-- shirt collar points -->
    <path d="M42 66.4 L48 73.4 L44.6 76.4 L40.2 68.4 Z" fill="#f8f9fa"/>
    <path d="M54 66.4 L48 73.4 L51.4 76.4 L55.8 68.4 Z" fill="#dfe3e7"/>
