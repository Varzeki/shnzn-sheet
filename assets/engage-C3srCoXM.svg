    <path id="eng-hair" d="M34.2 41 C32.4 31 33.6 22.6 38.6 18 C43 14 50.4 12.6 56.4 14.6 C62.6 16.8 64.4 24 63.4 32 L61.8 41 L61 41 C61.4 35 60.4 31.2 57.4 29.8 C52.8 28 46.4 27.6 42.4 29 C38.4 30.4 35.8 34.6 35.4 41 Z"/>
