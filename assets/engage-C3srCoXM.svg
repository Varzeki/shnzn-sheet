    <!-- smiling eyes and lifted brows -->
    <path d="M39.4 41.6 Q42 38.8 44.6 41.6 Q42 40.8 39.4 41.6 Z" fill="#1b1412" stroke="#1b1412" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M51.4 41.6 Q54 38.8 56.6 41.6 Q54 40.8 51.4 41.6 Z" fill="#1b1412" stroke="#1b1412" stroke-width=".9" stroke-linejoin="round"/>
    <path d="M38.4 35.4 Q41.6 33 45.2 34.6" stroke="#1d1817" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M50.8 34.6 Q54.4 33 57.6 35.4" stroke="#1d1817" stroke-width="1.6" fill="none" stroke-linecap="round"/>
