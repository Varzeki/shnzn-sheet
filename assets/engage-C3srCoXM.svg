      <path d="M43.4 52 Q48 50.6 52.6 52 Q48 58 43.4 52 Z" fill="#3a1f19"/>
      <path d="M44.2 52.2 Q48 51.2 51.8 52.2 L51.2 53.6 Q48 53 44.8 53.6 Z" fill="#f4f0ea"/>
      <!-- nose -->
      <path d="M48.4 39.6 L51 47 L47.2 47.6 Z" fill="#95664b"/>
      <path d="M44.8 47 Q48 49 51.6 47 Q48 49.8 44.8 47 Z" fill="#7a5038"/>
