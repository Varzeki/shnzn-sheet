    <path d="M40.4 68 L46.4 88 L43.4 96 L38.6 96 L36.8 81 L39.2 78.4 L36.4 73.4 Z" fill="#363c44"/>
    <path d="M55.6 68 L49.6 88 L52.6 96 L57.4 96 L59.2 81 L56.8 78.4 L59.6 73.4 Z" fill="#2b3037"/>
    <path d="M40.4 68 L46.4 88 L45.6 89 L39.6 69.2 Z" fill="#d63f28"/>
    <path d="M55.6 68 L49.6 88 L50.4 89 L56.4 69.2 Z" fill="#d63f28"/>
