    <g clip-path="url(#eng-cHair)">
      <path d="M33 30 C34 20 42 13.4 52 13 L57 13 C47 16 40 21 37.4 32 Z" fill="#3a3432"/>
      <path d="M58 13 L68 13 L68 44 L61.6 44 C64 32 63 20 58 13 Z" fill="#171312"/>
      <path d="M44 15 C49 15.4 54.4 17.4 57.4 21 L56 21.6 C52.8 19 48.4 17.4 44 17 Z" fill="#4a4442"/>
    </g>
