    <path d="M35.6 40.6 L38.6 40.4" stroke="#3a4049" stroke-width=".9"/>
    <rect x="38.4" y="38.2" width="7.6" height="5.6" rx="1.6" fill="#f2c043" fill-opacity=".38" stroke="#f2c043" stroke-width=".9"/>
    <rect x="39.4" y="39" width="3" height="1" rx=".5" fill="#fff4cc"/>
    <path d="M33.2 42.4 C31.6 42.4 31.2 46.4 33.6 46.6 L35 46.4 L35 42.6 Z" fill="#23272d"/>
    <circle cx="33" cy="44.4" r=".7" fill="#d63f28"/>
  </g>
</svg>
